name: 03 Application AI/ML Continuous Delivery
on:
  push:
    branches:
      - main
    paths:
      - 'applications/ai-ml/**'
  workflow_dispatch:
    inputs:
      terraform_action:
        description: 'Terraform Action to perform'
        required: true
        default: 'apply'
        type: choice
        options:
          - 'apply'
          - 'destroy'

      terraform_cli_version:
        description: 'Terraform CLI Version'
        required: true
        default: 'latest'
        type: string

      root_module_folder_relative_path:
        description: 'Relative path of Terraform scripts to be executed'
        required: true
        default: './applications/ai-ml'
        type: string

      state_file_path:
        description: 'Full path of terraform state file'
        default: 'applications/ai-ml/terraform.tfstate'
        type: string

jobs:
  plan_and_apply:
    uses: yvaishalir-dg/alz-mgmt-templates/.github/workflows/cd-template.yaml@main
    name: 'CD'
    permissions:
      id-token: write
      contents: read
    with:
      terraform_action: ${{ inputs.terraform_action }}
      root_module_folder_relative_path: ${{ inputs.root_module_folder_relative_path || './applications/ai-ml' }}
      terraform_cli_version: ${{ inputs.terraform_cli_version }} 

      